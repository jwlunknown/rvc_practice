<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10251b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tossed">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>TOSSED | Rogue Valley Cornhole</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button id="homeBtn" class="icon-btn" aria-label="Home">☰</button>
      <div class="brand"><h1>TOSSED</h1><p>Rogue Valley Cornhole</p></div>
      <button id="fullscreenBtn" class="icon-btn" aria-label="Toggle fullscreen">⛶</button>
    </header>

    <section id="setupScreen" class="screen active">
      <div class="card">
        <h2>Choose a game</h2>
        <div class="game-grid" id="gameGrid"></div>
      </div>

      <div class="card" id="playerSetupCard">
        <h2 id="setupTitle">Play Riley</h2>
        <div id="setupFields"></div>
        <button id="startBtn" class="primary full">Start Game</button>
        <button id="resumeBtn" class="secondary full hidden">Resume Saved Game</button>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="card current-throw">
        <div class="eyebrow">CURRENT THROW</div>
        <div id="gameLabel" class="game-label"></div>
        <div id="bagPreview" class="bag-preview">— — — —</div>
        <div id="pendingPreview" class="tiny"></div>
        <div id="turnText" class="turn-text"></div>
        <div id="roundProgress" class="round-progress"></div>
      </div>

      <div class="card score-entry">
        <button class="bag-btn in" data-score="3" data-icon="🕳️">🕳️<span>IN</span></button>
        <button class="bag-btn on" data-score="1" data-icon="🟨">🟨<span>ON</span></button>
        <button class="bag-btn off" data-score="0" data-icon="❌">❌<span>OFF</span></button>
        <button id="undoBtn" class="bag-btn undo">↶<span>UNDO</span></button>
      </div>

      <div id="playerCards"></div>

      <div class="card action-card">
        <div class="two-col">
          <button id="gamesBtn" class="secondary">Games / Players</button>
          <button id="resetBtn" class="danger">Reset</button>
        </div>
        <button id="submitBtn" class="primary full">Submit Final Game</button>
        <div id="saveStatus" class="tiny">Auto-save ready.</div>
      </div>

      <div class="card">
        <h2>Rounds</h2>
        <div id="roundList" class="round-list"></div>
      </div>
    </section>

    <div id="installHint" class="install-hint hidden">
      <strong>Install Tossed</strong>
      <span id="installText"></span>
      <button id="dismissInstall" class="text-btn">Dismiss</button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
