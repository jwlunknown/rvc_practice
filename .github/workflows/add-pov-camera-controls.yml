name: Add POV camera controls

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-pov-camera-controls.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Add camera controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('calculator/app.js')
          css_path = Path('calculator/styles.css')
          app = app_path.read_text()
          css = css_path.read_text()

          marker = 'POV_CAMERA_CONTROLS_V1'
          if marker not in app:
              app = app.replace(
                  'function renderPov(s,frac){',
                  "let povZoom=1,povYaw=0,povPitch=0;/* POV_CAMERA_CONTROLS_V1 */\nfunction renderPov(s,frac){",
                  1,
              )

              old_camera = "const eye={x:s.releaseX-1.8,y:Math.max(5.8,s.y0+1.6),z:s.releaseZ},look={x:29.5,y:.9,z:s.zTarget},forward=vnorm(vsub(look,eye)),right=vnorm(vcross(forward,{x:0,y:1,z:0})),up=vcross(right,forward),focal=(w/2)/Math.tan(68*Math.PI/360),"
              new_camera = "const yaw=povYaw*Math.PI/180,pitch=povPitch*Math.PI/180,cameraRadius=2.15,eye={x:s.releaseX-cameraRadius*Math.cos(yaw),y:Math.max(4.8,s.y0+1.2)+Math.sin(pitch)*3.2,z:s.releaseZ+cameraRadius*Math.sin(yaw)},look={x:29.5,y:.9,z:s.zTarget},forward=vnorm(vsub(look,eye)),right=vnorm(vcross(forward,{x:0,y:1,z:0})),up=vcross(right,forward),focal=((w/2)/Math.tan(68*Math.PI/360))*povZoom,"
              if old_camera not in app:
                  raise SystemExit('POV camera projection block was not found')
              app = app.replace(old_camera, new_camera, 1)

              app += r'''

function setupPovCameraControls(){
  const view=document.querySelector('.view.pov'),canvas=$('povCanvas');
  if(!view||!canvas||$('povZoom'))return;
  const panel=document.createElement('section');
  panel.className='pov-camera-controls';
  panel.setAttribute('aria-label','Player POV camera controls');
  panel.innerHTML=`
    <div class="pov-camera-head"><strong>POV camera</strong><span>Drag the view to orbit · scroll to zoom</span></div>
    <div class="pov-camera-grid">
      <label><span>Zoom <output id="povZoomValue">1.00×</output></span><input id="povZoom" type="range" min="0.55" max="2.20" step="0.05" value="1"></label>
      <label><span>Side angle <output id="povYawValue">0°</output></span><input id="povYaw" type="range" min="-55" max="55" step="1" value="0"></label>
      <label><span>View height <output id="povPitchValue">0°</output></span><input id="povPitch" type="range" min="-20" max="20" step="1" value="0"></label>
      <button id="resetPovCamera" class="action-button" type="button">Reset camera</button>
    </div>`;
  view.insertBefore(panel,canvas);

  const zoom=$('povZoom'),yaw=$('povYaw'),pitch=$('povPitch');
  function syncPovCameraControls(){
    zoom.value=povZoom;yaw.value=povYaw;pitch.value=povPitch;
    $('povZoomValue').textContent=`${povZoom.toFixed(2)}×`;
    $('povYawValue').textContent=`${Math.round(povYaw)}°`;
    $('povPitchValue').textContent=`${Math.round(povPitch)}°`;
    if(current)renderPov(current,currentFraction);
  }
  window.syncPovCameraControls=syncPovCameraControls;
  zoom.addEventListener('input',()=>{povZoom=+zoom.value;syncPovCameraControls()});
  yaw.addEventListener('input',()=>{povYaw=+yaw.value;syncPovCameraControls()});
  pitch.addEventListener('input',()=>{povPitch=+pitch.value;syncPovCameraControls()});
  $('resetPovCamera').addEventListener('click',()=>{povZoom=1;povYaw=0;povPitch=0;syncPovCameraControls()});

  let drag=null;
  canvas.addEventListener('pointerdown',event=>{
    drag={x:event.clientX,y:event.clientY,yaw:povYaw,pitch:povPitch};
    canvas.setPointerCapture?.(event.pointerId);
    document.body.classList.add('camera-dragging');
  });
  canvas.addEventListener('pointermove',event=>{
    if(!drag)return;
    povYaw=clamp(drag.yaw+(event.clientX-drag.x)*.16,-55,55);
    povPitch=clamp(drag.pitch-(event.clientY-drag.y)*.10,-20,20);
    syncPovCameraControls();
  });
  const stopDrag=()=>{drag=null;document.body.classList.remove('camera-dragging')};
  canvas.addEventListener('pointerup',stopDrag);
  canvas.addEventListener('pointercancel',stopDrag);
  canvas.addEventListener('wheel',event=>{
    event.preventDefault();
    povZoom=clamp(povZoom*(event.deltaY>0?.92:1.08),.55,2.2);
    syncPovCameraControls();
  },{passive:false});
  syncPovCameraControls();
}
setupPovCameraControls();
'''

          css_marker = '/* POV_CAMERA_CONTROLS_V1 */'
          if css_marker not in css:
              css += r'''

/* POV_CAMERA_CONTROLS_V1 */
.pov-camera-controls{margin:0 0 9px;padding:9px 10px;border:1px solid var(--border);border-radius:11px;background:color-mix(in srgb,var(--panel) 82%,transparent)}
.pov-camera-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}.pov-camera-head span{color:var(--muted);font-size:.74rem}
.pov-camera-grid{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr)) auto;gap:9px;align-items:end}.pov-camera-grid label{display:grid;gap:4px;color:var(--muted);font-size:.78rem}.pov-camera-grid label>span{display:flex;justify-content:space-between;gap:8px}.pov-camera-grid output{color:var(--accent);font-weight:750;font-variant-numeric:tabular-nums}.pov-camera-grid input{width:100%}
#povCanvas{cursor:grab;touch-action:none}.camera-dragging #povCanvas{cursor:grabbing}
@media(max-width:900px){.pov-camera-grid{grid-template-columns:repeat(2,minmax(130px,1fr))}.pov-camera-head{display:block}.pov-camera-head span{display:block;margin-top:2px}}
@media(max-width:520px){.pov-camera-grid{grid-template-columns:1fr}.pov-camera-grid .action-button{width:100%}}
'''

          app_path.write_text(app)
          css_path.write_text(css)
          PY

      - name: Commit camera controls
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Camera controls are already present."
            exit 0
          fi
          git config user.name "RVC Bag Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add calculator/app.js calculator/styles.css
          git commit -m "Add adjustable POV camera controls"
          git push
