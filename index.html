<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tossed Toss Tracker</title>
<style>
:root{--bg:#0b1711;--card:#173225;--card2:#203d2d;--cream:#fff1d2;--muted:#d4c49e;--orange:#d65a0b;--green:#4d9560;--gold:#e3bb65}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#101613,#0a2015);color:var(--cream);font-family:system-ui,-apple-system,sans-serif}
.app{max-width:720px;margin:auto;padding:18px 16px 48px}.brand{text-align:center;margin:8px 0 20px}.brand h1{font-size:42px;letter-spacing:5px;margin:0}.brand p{margin:2px;color:var(--muted)}
.card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid #355744;border-radius:25px;padding:18px;margin:14px 0;box-shadow:0 12px 28px #0005}
h2,h3{margin:0 0 10px}label{display:block;font-size:11px;letter-spacing:1.4px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase}
input,select,button{font:inherit}input,select{width:100%;padding:14px;border-radius:14px;border:1px solid #58705e;background:#10251b;color:var(--cream)}
button{border:0;border-radius:16px;padding:15px;font-weight:800;cursor:pointer}.primary{background:var(--orange);color:white}.secondary{background:var(--green);color:white}.gold{background:var(--gold);color:#18140b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.status,.tiny{font-size:12px;color:var(--muted);margin-top:9px}
.player-head{display:flex;justify-content:space-between;align-items:center}.pid{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);margin-top:12px;border-radius:16px;overflow:hidden}.stat{background:#1b3126;padding:10px 3px;text-align:center;border-right:1px solid #ffffff0d}.stat:last-child{border:0}.stat b{display:block;font-size:17px}.stat small{font-size:9px;color:var(--muted)}
.throw{text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center}.throw-title{font-size:12px;letter-spacing:3px;color:var(--muted)}.bags{font-size:31px;letter-spacing:8px;margin:14px 0 3px}.score{font-size:24px;font-weight:900}.undo{margin:12px auto 0;width:56px;height:48px;font-size:26px;background:#554d3e;color:white;padding:0}
.score-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.score-buttons button{min-height:82px;font-size:20px}.in{background:#4b9860;color:white}.on{background:#e3bb65;color:#17140c}.off{background:#d4560e;color:white}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.more{width:100%;background:#294a38;color:var(--cream);margin-top:10px}.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.shelf div{background:#10251b;padding:10px;border-radius:12px;text-align:center}.shelf b{display:block}
</style>
</head>
<body><main class="app">
<div class="brand"><h1>TOSSED</h1><p>Rogue Valley Cornhole</p></div>

<section id="home">
<div class="card"><h2>Toss Tracker</h2><div class="tiny">Four bags at a time. Every round becomes part of your history.</div>
<label>Player name</label><input id="playerName" placeholder="Your name"><div id="savedPlayer" class="status"></div>
<button class="primary" style="width:100%;margin-top:12px" onclick="continuePlayer()">Continue</button></div>
<div class="card"><h3>Live Room</h3><label>Private 4-digit key</label><input id="roomCode" inputmode="numeric" maxlength="4" placeholder="2146">
<div class="row" style="margin-top:10px"><button class="gold" onclick="createRoom()">Create Room</button><button class="secondary" onclick="joinRoom()">Join Room</button></div>
<div id="roomStatus" class="status">Offline-style solo tracking is available without joining a room.</div></div>
</section>

<section id="tracker" class="hidden">
<div class="card"><div class="player-head"><div><h2 id="displayName">Player</h2><div id="playerIdText" class="pid"></div></div><button class="secondary" onclick="showHome()">Home</button></div>
<div id="statsRow" class="stats"></div><button class="more" onclick="toggleMore()">More Stats ▾</button><div id="moreStats" class="shelf hidden"></div></div>

<div class="card"><div class="meta">
<div><label>Environment</label><select id="environment"><option value="indoor">Indoor</option><option value="outdoor">Outdoor</option></select></div>
<div><label>Start position</label><select id="startPosition"><option value="inside">Inside</option><option value="outside">Outside</option></select></div>
</div><label>Stats window</label><select id="lookback" onchange="renderStats()"><option value="session">Current session</option><option value="5">Last 5 rounds</option><option value="10">Last 10 rounds</option><option value="20">Last 20 rounds</option><option value="all">All time</option></select>
<button class="gold" style="width:100%;margin-top:12px" onclick="newSession()">Start New Session / Game</button></div>

<div class="card throw"><div class="throw-title">CURRENT THROW</div><div id="bags" class="bags">— — — —</div><div id="roundScore" class="score">0 PTS</div><div id="positionText" class="tiny">INSIDE</div><button class="undo" aria-label="Undo last bag" onclick="undo()">↶</button></div>

<div class="score-buttons"><button class="in" onclick="toss('IN')">IN<br>+3</button><button class="on" onclick="toss('ON')">ON<br>+1</button><button class="off" onclick="toss('OFF')">OFF<br>+0</button></div>
<div id="saveStatus" class="status" style="text-align:center;margin-top:14px"></div>
</section></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://gymkbeqmvuhlivobnyvd.supabase.co";
const SUPABASE_KEY="sb_publishable_XCutLWC_6v7mXOUa3qaHgw_U3y5fW-U";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let player=JSON.parse(localStorage.getItem('tossed_player')||'null'),sessionId=null,current=[],rounds=[],position='inside',room=null,saving=false;
const score={IN:3,ON:1,OFF:0};
if(player){playerName.value=player.display_name;savedPlayer.textContent='Saved player: '+player.display_name+' · '+player.player_id.slice(0,8).toUpperCase()}
async function continuePlayer(){
 const name=playerName.value.trim();if(!name)return;
 if(!player||player.display_name!==name){const {data,error}=await sb.from('players').insert({display_name:name}).select().single();if(error){savedPlayer.textContent=error.message;return}player=data;localStorage.setItem('tossed_player',JSON.stringify(player))}
 home.classList.add('hidden');tracker.classList.remove('hidden');displayName.textContent=player.display_name;playerIdText.textContent='PLAYER '+player.player_id.slice(0,8).toUpperCase();await newSession();
}
async function newSession(){
 current=[];position=startPosition.value;saveStatus.textContent='Starting session…';
 const {data,error}=await sb.from('throw_sessions').insert({player_id:player.player_id,room_code:room,environment:environment.value,starting_position:position}).select().single();
 if(error){saveStatus.textContent='Session error: '+error.message;return}
 sessionId=data.session_id;const {data:r}=await sb.from('rounds').select('*').eq('player_id',player.player_id).order('thrown_at',{ascending:true});rounds=r||[];saveStatus.textContent='Session ready';render();
}
function showHome(){tracker.classList.add('hidden');home.classList.remove('hidden')}
function toss(v){if(current.length>=4||saving)return;current.push(v);render();if(current.length===4)setTimeout(saveRound,250)}
function undo(){if(!saving&&current.length){current.pop();render()}}
async function saveRound(){
 if(current.length!==4||!sessionId||saving)return;saving=true;
 const snapshot=[...current],pts=snapshot.reduce((a,b)=>a+score[b],0),rn=rounds.filter(r=>r.session_id===sessionId).length+1;
 const payload={session_id:sessionId,player_id:player.player_id,round_number:rn,position,bag_1:snapshot[0],bag_2:snapshot[1],bag_3:snapshot[2],bag_4:snapshot[3],points:pts};
 const {data,error}=await sb.from('rounds').insert(payload).select().single();
 if(error){saveStatus.textContent='Save error: '+error.message;saving=false;return}
 rounds.push(data);saveStatus.textContent='Round '+rn+' saved · '+pts+' points';current=[];position=position==='inside'?'outside':'inside';saving=false;render();
}
function windowRounds(){const v=lookback.value;if(v==='session')return rounds.filter(r=>r.session_id===sessionId);if(v==='all')return rounds;return rounds.slice(-Number(v))}
function calc(rs){const n=rs.length,b=n*4,pts=rs.reduce((a,r)=>a+r.points,0),vals=rs.flatMap(r=>[r.bag_1,r.bag_2,r.bag_3,r.bag_4]);return{ppr:n?(pts/n).toFixed(2):'0.00',rounds:n,in_pct:b?Math.round(vals.filter(x=>x==='IN').length/b*100)+'%':'0%',on_pct:b?Math.round(vals.filter(x=>x==='ON').length/b*100)+'%':'0%',off_pct:b?Math.round(vals.filter(x=>x==='OFF').length/b*100)+'%':'0%',board_pct:b?Math.round(vals.filter(x=>x!=='OFF').length/b*100)+'%':'0%',bags:b,total_points:pts,ten_plus:rs.filter(r=>r.points>=10).length,clean:rs.filter(r=>![r.bag_1,r.bag_2,r.bag_3,r.bag_4].includes('OFF')).length}}
function renderStats(){const s=calc(windowRounds()),p=[['PPR',s.ppr],['RDS',s.rounds],['IN',s.in_pct],['OFF',s.off_pct],['POS',position.toUpperCase()]];statsRow.innerHTML=p.map(x=>'<div class="stat"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('');moreStats.innerHTML=[['ON',s.on_pct],['BOARD',s.board_pct],['BAGS',s.bags],['POINTS',s.total_points],['10+',s.ten_plus],['CLEAN',s.clean]].map(x=>'<div><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('')}
function render(){const symbols={IN:'●',ON:'○',OFF:'×'};bags.textContent=[...current,...Array(4-current.length).fill('—')].map(x=>symbols[x]||x).join('  ');roundScore.textContent=current.reduce((a,b)=>a+score[b],0)+' PTS';positionText.textContent=position.toUpperCase();renderStats()}
function toggleMore(){moreStats.classList.toggle('hidden')}
async function createRoom(){const c=roomCode.value.replace(/\D/g,'').slice(0,4);if(c.length!==4)return roomStatus.textContent='Enter exactly 4 digits.';const {error}=await sb.from('live_rooms').insert({room_code:c,game_state:{}});if(error)return roomStatus.textContent=error.code==='23505'?'Room exists — join it instead.':error.message;room=c;roomStatus.textContent='Room '+c+' created.'}
async function joinRoom(){const c=roomCode.value.replace(/\D/g,'').slice(0,4);const {data}=await sb.from('live_rooms').select('room_code').eq('room_code',c).maybeSingle();if(!data)return roomStatus.textContent='Room not found.';room=c;roomStatus.textContent='Joined room '+c+'.'}
render();
</script></body></html>
